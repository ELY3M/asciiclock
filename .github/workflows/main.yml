name: Build Bin

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:
  workflow_call:

permissions: write-all

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: build
        run: g++ main.cpp -o asciiclock

      - name: test
        run: ls -la

      - name: get date/date 
        env:
          TZ: "America/Chicago"
        run: | 
          echo "NOW=$(date +'%m-%d-%Y-%I.%M.%S.%p')" >> $GITHUB_ENV
          
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NOW }}
          prerelease: false
          draft: false
          body: ${{ github.event.head_commit.message }}
          files: asciiclock
          name: "Release ${{ env.NOW }}"